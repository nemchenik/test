name: Catalog batches 64-66 raw visualization and plans SEO
on: {workflow_dispatch: {}}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-plans-pinterest-cards}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow requests beautifulsoup4
      - run: python pinterest/batches64_66_raw_visual_plans_seo_static.py
        env: {ASSET_BRANCH: catalog-plans-pinterest-assets}
