name: Catalog Plans batch 43 burgundy atelier videos

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "pinterest/batch43_burgundy_atelier_video.py"
      - ".github/workflows/catalog-batch43-burgundy-atelier-video.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout generator branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout public asset branch
        uses: actions/checkout@v4
        with:
          ref: catalog-plans-pinterest-assets
          path: asset_repo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade requests beautifulsoup4 pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate and validate 200 burgundy atelier MP4 files
        env:
          ASSET_CHECKOUT: ${{ github.workspace }}/asset_repo
          ASSET_BRANCH: catalog-plans-pinterest-assets
        run: python pinterest/batch43_burgundy_atelier_video.py

      - name: Publish MP4 files to asset branch
        working-directory: asset_repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest/generated_batch_43_burgundy_atelier_video
          if ! git diff --cached --quiet; then
            git commit -m "Publish Catalog Plans batch 43 burgundy atelier videos"
            git fetch origin catalog-plans-pinterest-assets
            git rebase origin/catalog-plans-pinterest-assets
            git push origin HEAD:catalog-plans-pinterest-assets
          fi

      - name: Verify all 200 public MP4 URLs
        env:
          ASSET_CHECKOUT: ${{ github.workspace }}/asset_repo
          ASSET_BRANCH: catalog-plans-pinterest-assets
        run: python pinterest/batch43_burgundy_atelier_video.py --verify-public

      - name: Commit verified CSV and validation reports to generator branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest/batch43_video_output
          if ! git diff --cached --quiet; then
            git commit -m "Add verified Catalog Plans batch 43 Pinterest CSV [skip ci]"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Upload verified CSV and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: catalog-plans-batch43-burgundy-atelier-video-pins-verified
          path: |
            pinterest/batch43_video_output/catalog_plans_pinterest_burgundy_atelier_videos_batch_43_200.csv
            pinterest/batch43_video_output/local_validation_batch43.json
            pinterest/batch43_video_output/public_validation_batch43.json
          if-no-files-found: error
          retention-days: 14
