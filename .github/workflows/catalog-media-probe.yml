name: Catalog Plans media probe

on:
  pull_request:
    branches: [main]
    paths:
      - "pinterest/probe_media_sections.py"
      - ".github/workflows/catalog-media-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Probe real project media
        run: python pinterest/probe_media_sections.py

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-plans-media-probe
          path: pinterest/probe_media_output/media_probe.json
          if-no-files-found: error
          retention-days: 7
