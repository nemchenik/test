name: Catalog Plans image audit

on:
  pull_request:
    branches: [main]
    paths:
      - "pinterest/**"
      - ".github/workflows/catalog-image-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pillow

      - name: Audit project pages and generate corrected CSV
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python pinterest/audit_generate.py

      - name: Upload audit, previews and corrected CSV
        uses: actions/upload-artifact@v4
        with:
          name: catalog-plans-verified-pinterest-cards
          path: pinterest/audit_output/
          if-no-files-found: error
          retention-days: 7
