name: Catalog Plans image audit

on:
  pull_request:
    branches: [main]
    paths:
      - "pinterest/audit_generate_v3.py"
      - "pinterest/projects_candidates.txt"
      - "pinterest/audit_trigger.txt"
      - ".github/workflows/catalog-image-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pillow

      - name: Audit exact project pages and render vertical cards
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python pinterest/audit_generate_v3.py

      - name: Commit verified cards to the PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest/generated_batch_27
          if ! git diff --cached --quiet; then
            git commit -m "Generate verified Catalog Plans Pinterest cards [skip ci]"
            git push origin HEAD:${HEAD_BRANCH}
          fi

      - name: Upload audit, contact sheet and corrected CSV
        uses: actions/upload-artifact@v4
        with:
          name: catalog-plans-verified-pinterest-cards
          path: pinterest/audit_output/
          if-no-files-found: error
          retention-days: 7
