name: Catalog Plans image audit

on:
  pull_request:
    branches: [main]
    paths:
      - "pinterest/batch28_generate.py"
      - "pinterest/batch28_generate_fixed.py"
      - "pinterest/audit_trigger.txt"
      - ".github/workflows/catalog-image-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pillow

      - name: Discover and audit 200 additional house projects
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ASSET_BRANCH: catalog-plans-pinterest-assets
        run: python pinterest/batch28_generate_fixed.py

      - name: Commit verified cards to the PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest/generated_batch_28_no_button
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate batch 28 with precise project metadata [skip ci]"
            git push origin HEAD:${HEAD_BRANCH}
          fi

      - name: Upload audit, contact sheet and corrected CSV
        uses: actions/upload-artifact@v4
        with:
          name: catalog-plans-house-cards-batch-28-no-button
          path: pinterest/audit_output_batch28/
          if-no-files-found: error
          retention-days: 7
