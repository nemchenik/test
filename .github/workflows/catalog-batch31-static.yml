name: Catalog Plans batch 31 static repair

on:
  pull_request:
    branches: [main]
    paths:
      - "pinterest/batch31_static_repair_v3.py"
      - "pinterest/batch31_static_repair_v2.py"
      - "pinterest/batch31_static_trigger.txt"
      - ".github/workflows/catalog-batch31-static.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pillow

      - name: Render 200 verified static cards
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ASSET_BRANCH: catalog-plans-pinterest-assets
        run: python pinterest/batch31_static_repair_v3.py

      - name: Commit generated cards to the PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest/generated_batch_31_static_fixed
          if ! git diff --cached --quiet; then
            git commit -m "Generate 200 reliable static Pinterest cards for batch 31 [skip ci]"
            git push origin HEAD:${HEAD_BRANCH}
          fi

      - name: Upload CSV, audit and contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: catalog-plans-batch31-static-fixed
          path: pinterest/batch31_static_fixed_output/
          if-no-files-found: error
          retention-days: 7
