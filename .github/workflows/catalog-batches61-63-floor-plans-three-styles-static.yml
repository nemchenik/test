name: Catalog batches 61-63 floor plans three styles
on: {workflow_dispatch: {}}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: catalog-plans-pinterest-cards}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow requests beautifulsoup4
      - run: python pinterest/batches61_63_floor_plans_three_styles_static.py
        env: {ASSET_BRANCH: catalog-plans-pinterest-assets}
