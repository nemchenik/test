<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=1200,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:1800px;overflow:hidden;font-family:Arial,sans-serif;background:#162019;color:#17211b}.card{position:relative;width:1200px;height:1800px;overflow:hidden;background:#d9d4ca}.house{position:absolute;inset:0 0 560px;width:100%;height:1240px;object-fit:cover;background:#bbb}.shade{position:absolute;inset:0 0 560px;background:linear-gradient(180deg,rgba(8,16,11,.68),transparent 42%,rgba(8,16,11,.67))}.top{position:absolute;z-index:2;top:48px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;color:#fff}.brand{font-weight:800;font-size:32px;letter-spacing:.15em}.project{padding:19px 28px;border:2px solid #ffffffaa;border-radius:99px;background:#101a144d;font-size:28px;font-weight:700}.hero{position:absolute;z-index:2;left:64px;bottom:610px;max-width:950px;color:#fff;text-shadow:0 4px 30px #0009}.eyebrow{font-size:25px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero h1{margin:17px 0 0;font-size:69px;line-height:1.04;letter-spacing:-.04em}.panel{position:absolute;z-index:3;left:0;right:0;bottom:0;height:600px;padding:62px 64px 48px;border-radius:55px 55px 0 0;background:linear-gradient(145deg,#f7f3eb,#ebe3d6);box-shadow:0 -30px 85px #08100b55}.line{width:90px;height:10px;border-radius:12px;background:#c86f45}.panel h2{margin:36px 0 28px;max-width:1040px;font-size:56px;line-height:1.08;letter-spacing:-.035em}.chips{display:flex;gap:15px;flex-wrap:wrap}.chip{display:none;padding:14px 21px;border:2px solid #17211b25;border-radius:99px;background:#ffffff88;font-size:25px;font-weight:700}.bottom{position:absolute;left:64px;right:64px;bottom:48px;display:flex;justify-content:space-between;align-items:center}.domain{font-size:27px;font-weight:700;color:#17211ba8}.cta{min-width:430px;padding:27px 34px;border-radius:23px;background:linear-gradient(135deg,#c86f45,#994728);color:#fff;text-align:center;font-size:28px;font-weight:800;box-shadow:0 19px 40px #9947284d}</style></head><body><main class="card"><img id="img" class="house"><div class="shade"></div><div class="top"><div class="brand">CATALOG PLANS</div><div id="project" class="project"></div></div><div class="hero"><div id="eyebrow" class="eyebrow"></div><h1 id="title"></h1></div><section class="panel"><div class="line"></div><h2 id="panel"></h2><div class="chips"><span id="c1" class="chip"></span><span id="c2" class="chip"></span><span id="c3" class="chip"></span></div><div class="bottom"><div class="domain">catalog-plans.ru</div><div id="cta" class="cta"></div></div></section></main><script>const p=new URLSearchParams(location.search),g=(k,d='')=>(p.get(k)||d).trim(),s=(id,v)=>{if(v){const e=document.getElementById(id);e.textContent=v;e.style.display='inline-block'}};const pr=g('project','00-00'),area=g('area'),floors=g('floors'),dims=g('dims'),feature=g('feature'),style=g('style'),material=g('material');document.getElementById('img').src=g('img');document.getElementById('img').style.objectPosition='center '+g('position','50%');document.getElementById('project').textContent='Проект №'+pr;document.getElementById('eyebrow').textContent=g('eyebrow','Готовый проект');document.getElementById('title').textContent=g('title','Дом, который стоит рассмотреть');document.getElementById('panel').textContent=g('panel','Откройте планировку и параметры проекта');document.getElementById('cta').textContent=g('cta','Открыть проект →');const a=[];if(area)a.push(area+' м²');if(floors)a.push(floors);if(dims)a.push(dims+' м');if(feature)a.push(feature);if(style)a.push(style);if(material)a.push(material);s('c1',a[0]);s('c2',a[1]);s('c3',a[2]);</script></body></html>
